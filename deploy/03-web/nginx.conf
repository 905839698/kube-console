# kube-console 前端 Nginx 配置（唯一来源：web/Dockerfile 打进镜像，物理机部署直接复用本文件）
# 要点：
#   1. /api 反代到后端 —— Pod 终端(CI 运行推送/端口转发)是 WebSocket，CI 日志是 SSE，
#      必须透传升级头、关闭响应缓冲、读超时长开
#   2. 走 Ingress 路径分发时 /api 由 Ingress 接管，本段作为 NodePort/独立暴露的兜底
#   3. Vue Router history 模式：非 /api 路径回落 index.html
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器文件上传等请求体放宽
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # K8s 内解析；物理机部署请改为后端机器 IP:8080
        proxy_pass http://kube-console-server.kube-console.svc.cluster.local:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSocket 透传三件套（缺一个终端就连不上）
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE（CI 日志流）：必须关缓冲，否则日志攒批吐出
        proxy_buffering off;
        proxy_cache off;

        # 终端/日志为长连接：读超时长开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
