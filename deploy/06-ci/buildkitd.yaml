apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkitd-cache
  namespace: kube-console
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
  # storageClassName 留空 = 集群默认 StorageClass；没有默认 SC 就显式填一个
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: kube-console
  labels:
    app: buildkitd
spec:
  replicas: 1
  # 挂 RWO 缓存盘：滚动更新会先起新 Pod 而卷被旧 Pod 占着，卡 Pending；直接重建
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
    spec:
      containers:
        - name: buildkitd
          image: registry3.nhdc.cloud/library/buildkit:stable
          args: ["--addr", "tcp://0.0.0.0:1234", "--config", "/etc/buildkit/buildkitd.toml"]
          ports:
            - containerPort: 1234
              name: grpc
          securityContext:
            privileged: true
          readinessProbe:
            tcpSocket:
              port: 1234
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/buildkit
            - name: cache
              mountPath: /var/lib/buildkit
      volumes:
        - name: config
          configMap:
            name: buildkitd-config
        - name: cache
          persistentVolumeClaim:
            claimName: buildkitd-cache
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: kube-console
  labels:
    app: buildkitd
spec:
  selector:
    app: buildkitd
  ports:
    - port: 1234
      targetPort: grpc
