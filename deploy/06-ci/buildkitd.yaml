# 集群内共享 BuildKit 构建器（build-image 节点依赖，地址 tcp://buildkitd:1234）
# 在 CI 项目所在的命名空间 apply（流水线 run 落在哪个 ns，buildkitd 就得在哪个 ns，
# 否则短域名 buildkitd 解析不到）。buildkitd 兼容自签名 registry 靠下面的 buildkitd.toml；
# CA 与 server/internal/ci/node/nodes/build-image/task.yaml 内嵌的是同一张，续期时两处同步换。
# privileged: buildkitd（rootful 模式）构建容器需要；介意可换 rootless 变体（需额外配置）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: kube-console
data:
  buildkitd.toml: |
    # 基础镜像拉取路径：自签名 registry 走 CA 信任（push 路径的 insecure 由 buildctl 客户端承担）
