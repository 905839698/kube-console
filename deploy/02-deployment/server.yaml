# kube-console 后端 Deployment（PostgreSQL）
# 说明：
#   - 镜像按 server/Dockerfile 构建（多阶段，含 git：CI 的 GitLab 分支/Tag 接口依赖）
#   - 本应用采用 kubeconfig 注册制管理集群（界面中粘贴 kubeconfig 即可）
#   - 数据库为 PostgreSQL：先建库（CREATE DATABASE kube_console;），DSN 放 Secret 的 db-dsn
#   - 副本数保持 1：CI 后台同步循环在进程内运行，多副本会重复消费（未做 leader election）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-console-server
  namespace: kube-console
  labels:
    app: kube-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-console
  template:
    metadata:
      labels:
        app: kube-console
    spec:
      containers:
        - name: server
          # 构建并推送到你自己的仓库后替换（docker build -f server/Dockerfile -t <仓库>/kube-console-server:latest .）
          image: easzlab.io.local:5000/kube-console-server:fix-gateway
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
            # Nacos Pod 注入 Admission Webhook（HTTPS 自签）
            - containerPort: 9443
          env:
            - name: KC_DB_DRIVER
              value: postgres
            - name: KC_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: kube-console-secrets
                  key: db-dsn
            - name: KC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kube-console-secrets
                  key: jwt-secret
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kube-console-secrets
                  key: admin-password
            # Webhook 自签证书目录（须持久化，保证 caBundle 跨重启稳定）
            - name: KC_NACOS_CERT_DIR
              value: /data/nacos-cert
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        # /data 装两样东西：SQLite 元数据库（生产用 PG/MySQL 时不写）和 Nacos 注入的 Webhook 自签证书。
        # 用 PVC 而不是 emptyDir：emptyDir 下每次重启都会换一张新 CA，而 MutatingWebhookConfiguration
        # 里的 caBundle 是上一轮的 → 重启到首轮同步（启动后 15s）之间新建的 Pod 静默不被注入
        # （failurePolicy=Ignore，不报错）。集群没有默认 StorageClass 时可退回 emptyDir，代价就是这段窗口。
        - name: data
          persistentVolumeClaim:
            claimName: kube-console-data
---
# 证书与 SQLite 的落盘位置（RWO 即可：副本数固定 1）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kube-console-data
  namespace: kube-console
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
  # storageClassName 留空 = 用集群默认 StorageClass；没有默认 SC 就显式填一个，否则 Pod 一直 Pending
---
# 密钥与数据库连接：apply 前必须改成真值（或改用 SealedSecret/ExternalSecret 注入后删除本段）
# db-dsn 示例: host=10.0.0.1 user=kc password=xxx dbname=kube_console port=5432 sslmode=disable TimeZone=Asia/Shanghai
apiVersion: v1
kind: Secret
metadata:
  name: kube-console-secrets
  namespace: kube-console
type: Opaque
stringData:
  db-dsn: "host=POSTGRES_HOST user=kc password=CHANGE_ME dbname=kube_console port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  jwt-secret: "change-me-to-a-long-random-string"
  admin-password: "admin123"
