# kube-console 前端 Service + Ingress
apiVersion: v1
kind: Service
metadata:
  name: kube-console-web
  namespace: kube-console
spec:
  selector:
    app: kube-console-web
  ports:
    - port: 80
      targetPort: 80
---
# 前端与后端可通过同一域名发布，由 Ingress 按路径分发
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kube-console
  namespace: kube-console
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  rules:
    - host: kube-console.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kube-console-server
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-console-web
                port:
                  number: 80
