# npm-build Tekton Task 模板
# 单一 shell 入口：registry/代理、依赖安装、构建命令全部来自节点 script 参数，
# 在本节点镜像内、仓库根目录（workspaces.source）执行，与主步骤同一容器
# （npm config set / export 因此对后续命令生效；preShell 是独立容器，不生效）。
name: npm-build
description: "Node {{nodeVersion}} 自定义构建脚本"
workspaces:
  - name: source
  - name: cache
    optional: true
results:
  - name: build_output
    description: "产物路径（workspace 内；脚本里 export OUTPUT_DIR=<路径>，默认 dist）"
steps:
  - name: build
    image: {{imageRegistry}}/node:{{nodeVersion}}
    script: |
      #!/bin/bash
      set -e
      cd $(workspaces.source.path)
      # 依赖缓存：cache workspace 未绑定时 $(workspaces.cache.path) 为空串，自动跳过。
      # 三种包管理器各自的环境变量都在这里设好，后面的用户脚本直接继承——
      # 本节点是单一 shell 入口，这里 export 的值对后续命令都有效。
      # （注意：模板注释里不能写占位符本身，渲染是纯文本替换，它会被真值替换掉，
      #   多行值还会把注释行撑破成非法 YAML。）
      CACHE="$(workspaces.cache.path)"
      if [ "{{cache}}" = "true" ] && [ -n "$CACHE" ]; then
        mkdir -p "$CACHE/npm" "$CACHE/yarn" "$CACHE/pnpm"
        export npm_config_cache="$CACHE/npm"
        export YARN_CACHE_FOLDER="$CACHE/yarn"
        # Yarn Berry（v2+）用的是全局缓存，不看 YARN_CACHE_FOLDER
        export YARN_ENABLE_GLOBAL_CACHE=true
        export YARN_GLOBAL_CACHE_DIR="$CACHE/yarn-berry"
        # pnpm 没有官方缓存目录环境变量，只能用配置项；容器里没有全局配置，写用户级即可
        if command -v pnpm >/dev/null 2>&1; then
          pnpm config set store-dir "$CACHE/pnpm" >/dev/null 2>&1 || true
        fi
      fi
      {{script}}
      # 产物目录登记：节点属性 outputDir（默认 dist），脚本里 export OUTPUT_DIR=<路径> 可覆盖。
      # 目录不存在即判失败：bash 的 set -e 不会中断 "A && B && C" 链中靠前命令的失败
      # （链中断后脚本仍以 0 退出、步骤显示成功），这种静默成功会一路带到下游
      # build-image 才报 COPY dist not found，所以在这里就地拦下。
      : "${OUTPUT_DIR:={{outputDir}}}"
      if [ ! -e "$OUTPUT_DIR" ]; then
        echo "ERROR: 构建产物目录不存在: $OUTPUT_DIR（当前目录 $(pwd)）" >&2
        echo "  脚本里的命令可能没真正执行成功。注意 set -e 不会中断 \"A && B && C\" 链中靠前命令的失败，" >&2
        echo "  请逐条确认（例如 registry 是否先配置好、命令是否下载成功），或用 export OUTPUT_DIR=<实际产物目录> 指定。" >&2
        exit 1
      fi
      printf '%s' "$OUTPUT_DIR" > $(results.build_output.path)
