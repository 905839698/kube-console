# npm-build Tekton Task 模板
name: npm-build
description: "{{packageManager}} build (Node {{nodeVersion}})"
params:
  - name: packageManager
    type: string
    default: "{{packageManager}}"
  - name: installCommand
    type: string
    default: "{{installCommand}}"
  - name: buildCommand
    type: string
    default: "{{buildCommand}}"
  - name: outputDir
    type: string
    default: "{{outputDir}}"
workspaces:
  - name: source
  - name: cache
    optional: true
results:
  - name: build_output
    description: "产物路径（workspace 内）"
steps:
  - name: build
    image: harbor.cqyxpt.site:8443/library/node:{{nodeVersion}}
    script: |
      #!/bin/sh
      set -e
      cd $(workspaces.source.path)
      # 依赖缓存：cache workspace 未绑定时 $(workspaces.cache.path) 为空串，自动跳过
      CACHE="$(workspaces.cache.path)"
      if [ "{{cache}}" = "true" ] && [ -n "$CACHE" ]; then
        mkdir -p "$CACHE/{{packageManager}}"
        case "{{packageManager}}" in
          yarn) export YARN_CACHE_FOLDER="$CACHE/yarn" ;;
          pnpm) export XDG_CACHE_HOME="$CACHE/pnpm" ;;
          *) export npm_config_cache="$CACHE/npm" ;;
        esac
      fi
      {{packageManager}} {{installCommand}}
      {{packageManager}} run {{buildCommand}} || {{packageManager}} {{buildCommand}}
      ls -lh {{outputDir}} 2>/dev/null || true
      printf '%s' "{{outputDir}}" > $(results.build_output.path)
