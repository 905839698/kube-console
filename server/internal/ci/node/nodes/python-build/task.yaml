# python-build Tekton Task 模板
name: python-build
description: "Python {{pythonVersion}} build"
workspaces:
  - name: source
  - name: cache
    optional: true
results:
  - name: build_output
    description: "产物路径（workspace 内）"
steps:
  - name: build
    image: harbor.cqyxpt.site:8443/library/python:{{pythonVersion}}
    script: |
      #!/bin/sh
      set -e
      cd $(workspaces.source.path)
      # 依赖缓存：cache workspace 未绑定时 $(workspaces.cache.path) 为空串，自动跳过
      CACHE="$(workspaces.cache.path)"
      if [ "{{cache}}" = "true" ] && [ -n "$CACHE" ]; then
        export PIP_CACHE_DIR="$CACHE/pip"
        mkdir -p "$PIP_CACHE_DIR"
      fi
      [ -f requirements.txt ] && {{installCommand}} || true
      if [ -n "{{testCommand}}" ]; then {{testCommand}}; fi
      if [ -n "{{buildCommand}}" ]; then {{buildCommand}}; fi
      ls -lh dist/ 2>/dev/null || true
      # pip build 默认产出 dist/
      printf '%s' "dist" > $(results.build_output.path)
