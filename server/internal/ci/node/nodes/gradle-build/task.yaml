# gradle-build Tekton Task 模板
name: gradle-build
description: "Gradle build (JDK {{jdk}})"
workspaces:
  - name: source
  - name: cache
    optional: true
results:
  - name: build_output
    description: "产物路径 / 通配（workspace 内）"
steps:
  - name: build
    image: {{imageRegistry}}/gradle:8-jdk{{jdk}}
    script: |
      #!/bin/sh
      set -e
      cd $(workspaces.source.path)
      # 依赖缓存：cache workspace 未绑定时 $(workspaces.cache.path) 为空串，自动跳过
      CACHE="$(workspaces.cache.path)"
      if [ "{{cache}}" = "true" ] && [ -n "$CACHE" ]; then
        export GRADLE_USER_HOME="$CACHE/gradle"
        mkdir -p "$GRADLE_USER_HOME"
      fi
      if [ "{{useWrapper}}" = "true" ] && [ -x ./gradlew ]; then
        ./gradlew {{command}}
      else
        gradle {{command}}
      fi
      echo "ARTIFACTS:"
      ls -lh {{outputDir}} 2>/dev/null || true
      printf '%s' "{{outputDir}}" > $(results.build_output.path)
