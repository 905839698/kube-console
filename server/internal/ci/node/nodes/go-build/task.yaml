# go-build Tekton Task 模板
name: go-build
description: "Go {{goVersion}} build"
workspaces:
  - name: source
  - name: cache
    optional: true
results:
  - name: build_output
    description: "产物路径（workspace 内）"
steps:
  - name: build
    image: {{imageRegistry}}/golang:{{goVersion}}
    env:
      - name: CGO_ENABLED
        value: "0"
    script: |
      #!/bin/sh
      set -e
      cd $(workspaces.source.path)
      # 依赖缓存：cache workspace 未绑定时 $(workspaces.cache.path) 为空串，自动跳过
      CACHE="$(workspaces.cache.path)"
      if [ "{{cache}}" = "true" ] && [ -n "$CACHE" ]; then
        export GOMODCACHE="$CACHE/go/mod"
        export GOCACHE="$CACHE/go/build"
        export GOTELEMETRY=off
        mkdir -p "$GOMODCACHE" "$GOCACHE"
      fi
      [ "{{runTest}}" = "true" ] && go test ./...
      go {{command}} -o out/{{binaryName}} 2>/dev/null || go {{command}}
      ls -lh out/ 2>/dev/null || true
      printf '%s' "out/{{binaryName}}" > $(results.build_output.path)
