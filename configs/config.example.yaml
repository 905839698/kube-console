# kube-console 服务端配置示例
# 复制为 configs/config.yaml 后按需修改；所有字段均可通过 KC_ 前缀环境变量覆盖
# （如 KC_DB_DSN、KC_JWT_SECRET、KC_ADMIN_PASSWORD）

server:
  port: 8080

database:
  # 驱动: sqlite | mysql | postgres
  # 开发环境用 sqlite（纯 Go 驱动，无需安装数据库）；生产建议 MySQL/PostgreSQL
  driver: sqlite
  dsn: ./data/kube-console.db
  # MySQL 示例: root:password@tcp(127.0.0.1:3306)/kube_console?charset=utf8mb4&parseTime=True&loc=Local
  # PostgreSQL 示例: host=127.0.0.1 user=admin password=xxx dbname=kube_console port=5432 sslmode=disable TimeZone=Asia/Shanghai

jwt:
  secret: change-me-to-a-long-random-string
  expireIn: 24 # token 有效期（小时）

admin:
  username: admin
  password: admin123

k8s:
  # 终端调试容器镜像（内网集群需用私有仓库可拉取的镜像；env: KC_K8S_DEBUG_IMAGE）
  # 节点 shell 由该容器 nsenter 进宿主机，控制台强制以 root 拉起（runAsUser: 0），
  # 因此镜像自带非 root USER 也可用；要求：集群可拉取 + 内含 /bin/sh
  debugImage: busybox:1.36

ci:
  # CI 任务镜像仓库前缀（节点模板里 {{imageRegistry}} 的全局取值；env: KC_CI_IMAGE_REGISTRY）。
  # 换 Harbor/registry 只改这一处，全部 20 类 CI 节点镜像随之切换；镜像版本仍是各节点自己的参数。
  # 完整镜像清单见 docs/images.md
  imageRegistry: harbor.cqyxpt.site:8443/library

  # 自签名镜像仓库的根证书 PEM 文件路径（节点模板里 {{registryCA}} 的取值来源；
  # env: KC_CI_REGISTRY_CA_FILE）。为空则不注入，构建节点退回系统信任库
  # （registry 用公共证书时正好）。配了必须能读到，否则后端启动直接报错。
  # registryCAFile: /etc/kc/registry-ca.pem

  # 节点固定：把 CI 运行的全部 Pod（所有任务 + affinity-assistant）钉到指定节点——
  # 专用构建节点带污点时，nodeSelector 选节点、tolerations 容忍污点。
  # 注意：生效后存量项目工作区 PVC 的 PV 仍钉在旧节点（local-path 按首次消费者绑定），
  # 需在项目行「缓存」→ 清空依赖缓存（删盘重建）才会迁到新节点。
  # nodeSelector: {"kubernetes.io/hostname": "build-node-1"}
  # tolerations:
  #   - key: "type"
  #     operator: "Exists"
  #   - key: "node-role.kubernetes.io/build"
  #     operator: "Equal"
  #     value: "true"
  #     effect: "NoSchedule"

  # 镜像构建器（CI → 镜像构建器：上传 jar/二进制/前端 tar.gz，平台按约定 Dockerfile
  # 构建并推送镜像）。serverUrl 必填：任务 Pod 里的 artifact-fetch 节点凭它回调平台
  # 下载上传的制品，填平台在集群内的服务地址。
  # env: KC_CI_SERVER_URL / KC_CI_BUILDER_UPLOAD_DIR / KC_CI_BUILDER_UPLOAD_MAX_MB
  # serverUrl: http://kube-console-server.kube-console:8080   # 后端 Service 的集群内地址（deploy/04 清单），不是浏览器访问地址
  # builderUploadDir: ./data/ci-artifacts   # 制品存放目录（与 sqlite 同盘时注意容量）
  # builderUploadMaxMB: 512                 # 单个制品大小上限

obs:
  # 告警历史轮询 Alertmanager 的间隔（秒；env: KC_OBS_ALERT_INTERVAL）
  alertIntervalSec: 60
  # 告警历史保留天数，超期清理（env: KC_OBS_ALERT_RETENTION_DAYS）
  alertRetentionDays: 90
  # 事件归档轮询 K8s Events 写 ES 的间隔（秒；env: KC_OBS_EVENT_INTERVAL）
  eventIntervalSec: 60
  # 事件归档索引保留天数，按索引名日期删除过期索引，0 = 永不清理（env: KC_OBS_EVENT_RETENTION_DAYS）
  eventRetentionDays: 30

nacos:
  # 命名空间自动同步周期（秒；env: KC_NACOS_SYNC_INTERVAL）。连接地址/凭证在「平台管理 → Nacos 管理」按集群配置
  syncIntervalSec: 300
  # Pod 注入 Admission Webhook 的 HTTPS 监听端口（0 = 不启动；env: KC_NACOS_WEBHOOK_PORT）
  webhookPort: 9443
  # 不参与 Nacos 同步的系统命名空间（逗号分隔；env: KC_NACOS_SKIP_NAMESPACES）
  skipNamespaces: kube-system,kube-public,kube-node-lease,kube-console
  # Webhook 自签证书目录（须持久化，保证 caBundle 跨重启稳定；env: KC_NACOS_CERT_DIR）
  certDir: ./data

rbac:
  # 接口收口开关（env: KC_RBAC_ENFORCE_MENUS，只认 1 / true 为打开）。
  # 侧边栏显隐一直按「该用户在当前集群能读哪些资源」推导（后端 menus 给出）；打开这个
  # 开关后，同一套判定也用于接口：菜单里没给的模块，直接调接口返回 403。
  # 默认 false = 保持"资源读取登录即可浏览"的既有口径（写权限一直是逐接口判的）。
  # 打开前先确认该给的角色都在「授权」页授了：菜单能力来自用户生效角色的规则，
  # 手工 K8s 绑定也认，但没授权的用户切换后确实会看不见大部分页面。
  enforceMenus: false
