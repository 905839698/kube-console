# kube-console 服务端配置示例
# 复制为 configs/config.yaml 后按需修改；所有字段均可通过 KC_ 前缀环境变量覆盖
# （如 KC_DB_DSN、KC_JWT_SECRET、KC_ADMIN_PASSWORD）

server:
  port: 8080

database:
  # 驱动: sqlite | mysql | postgres
  # 开发环境用 sqlite（纯 Go 驱动，无需安装数据库）；生产建议 MySQL/PostgreSQL
  driver: sqlite
  dsn: ./data/kube-console.db
  # MySQL 示例: root:password@tcp(127.0.0.1:3306)/kube_console?charset=utf8mb4&parseTime=True&loc=Local
  # PostgreSQL 示例: host=127.0.0.1 user=admin password=xxx dbname=kube_console port=5432 sslmode=disable TimeZone=Asia/Shanghai

jwt:
  secret: change-me-to-a-long-random-string
  expireIn: 24 # token 有效期（小时）

admin:
  username: admin
  password: admin123

k8s:
  # 终端调试容器镜像（内网集群需用私有仓库可拉取的镜像；env: KC_K8S_DEBUG_IMAGE）
  debugImage: busybox:1.36

ci:
  # CI 任务镜像仓库前缀（节点模板里 {{imageRegistry}} 的全局取值；env: KC_CI_IMAGE_REGISTRY）。
  # 换 Harbor/registry 只改这一处，全部 19 类 CI 节点镜像随之切换；镜像版本仍是各节点自己的参数。
  # 完整镜像清单见 docs/images.md
  imageRegistry: harbor.cqyxpt.site:8443/library

obs:
  # 告警历史轮询 Alertmanager 的间隔（秒；env: KC_OBS_ALERT_INTERVAL）
  alertIntervalSec: 60
  # 告警历史保留天数，超期清理（env: KC_OBS_ALERT_RETENTION_DAYS）
  alertRetentionDays: 90
  # 事件归档轮询 K8s Events 写 ES 的间隔（秒；env: KC_OBS_EVENT_INTERVAL）
  eventIntervalSec: 60
  # 事件归档索引保留天数，按索引名日期删除过期索引，0 = 永不清理（env: KC_OBS_EVENT_RETENTION_DAYS）
  eventRetentionDays: 30

nacos:
  # 命名空间自动同步周期（秒；env: KC_NACOS_SYNC_INTERVAL）。连接地址/凭证在「平台管理 → Nacos 管理」按集群配置
  syncIntervalSec: 300
  # Pod 注入 Admission Webhook 的 HTTPS 监听端口（0 = 不启动；env: KC_NACOS_WEBHOOK_PORT）
  webhookPort: 9443
  # 不参与 Nacos 同步的系统命名空间（逗号分隔；env: KC_NACOS_SKIP_NAMESPACES）
  skipNamespaces: kube-system,kube-public,kube-node-lease,kube-console
  # Webhook 自签证书目录（须持久化，保证 caBundle 跨重启稳定；env: KC_NACOS_CERT_DIR）
  certDir: ./data
